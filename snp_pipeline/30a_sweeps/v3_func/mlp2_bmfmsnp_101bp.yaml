# WandB sweep — diff-attention v3 functional-integration modes
# Head: mlp2  Model: bmfm_snp  Seq: 101bp
# Same 42 runs as the rf variant but ε's are LEARNABLE here (per-modality nn.Parameter,
# init=0). Lets us see whether the model learns to weight eg eqtl > splice.
program: snp_pipeline/30v3_train_diff_attention_func.py
method: grid
metric:
  name: val_balanced_accuracy
  goal: maximize
command:
  - ${env}
  - python
  - ${program}
  - --wandb-project=adni-snp-diff-attn-v3-func-mlp2-bmfmsnp-101bp
  - --head=mlp2
  - --model=bmfm_snp
  - --seq-length=101bp
  - --base=/content/drive/MyDrive/ADNI_SNP/diff_attn_v2_upload
  - --splits-root=/nonexistent/force-fallback
  - ${args}
parameters:
  func_integration_mode:
    values:
      - none
      - per_snp_zscored_25
      - per_snp_summaries_12
      - attn_bias_single
      - attn_bias_per_modality
      - value_mult
      - attn_bias_per_modality_plus_value_mult
  aggregation:
    values: [global_attn, chrom_hier]
  seed:
    values: [0, 1, 2]
