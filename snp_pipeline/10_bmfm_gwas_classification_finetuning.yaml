# 10_bmfm_gwas_classification_finetuning.yaml
# =============================================
# Hydra config for BMFM-DNA-SNP fine-tuning on binned z-score classification.
#
# Extends: dna_finetune_train_and_test_config (from BMFM package defaults)
# Overrides: label_columns → classification, loss → CE, max_length → 2048 tokens
#
# Input data (train.csv / dev.csv / test.csv) generated by:
#   08h_prepare_bmfm_gwas_classification_inputs.py
# Format: sequence,z_bin,z_score,seq_id,...
#   z_bin ∈ {-3, -2, -1, 0, +1, +2, +3}
#
# Usage (on HPC, inside conda env with bmfm_targets installed):
#   bmfm-targets-run --config-path $(pwd) -cn 10_bmfm_gwas_classification_finetuning \
#       input_directory=$INPUT_DIRECTORY \
#       output_directory=$OUTPUT_DIRECTORY \
#       checkpoint=ibm-research/biomed.dna.snp.modernbert.113m.v1

hydra:
  searchpath:
    - file:///rds/user/ec474/hpc-work/biomed-multi-omic/run

defaults:
  - dna_finetune_train_and_test_config   # base DNA fine-tuning config from BMFM
  - _self_                               # allow this file to override defaults

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset_name: gwas_classification

data_module:
  max_length: 2048           # model pre-trained with 2048 tokens (paper §3.4); 8 kb bp ≈ 1600–2000 BPE tokens
  dataset_kwargs:
    processed_data_source: ${input_directory}
    dataset_name: ${dataset_name}
    label_dict_path: ${input_directory}/label_dict.json

# ── Label: binned z-score (7-class classification) ───────────────────────────
label_columns:
  - _target_: bmfm_targets.config.LabelColumnInfo
    label_column_name: "z_bin"
    is_regression_label: false

# ── Training ──────────────────────────────────────────────────────────────────
trainer:
  learning_rate: ${learning_rate}
  losses:
    - name: focal                     # focal loss handles class imbalance (CE does NOT support weights in BMFM)
      label_column_name: z_bin
      focal_gamma: 2.0                # γ=2.0 — down-weights easy (well-classified) examples

# ── Hyperparameters ───────────────────────────────────────────────────────────
batch_size: 4              # larger than regression since dataset is much bigger
max_epochs: 5              # classification tasks converge faster
learning_rate: 1.0e-5      # slightly higher LR for classification
accumulate_grad_batches: 16  # effective batch = 4 * 16 = 64
val_check_interval: 0.5       # validate twice per epoch
accelerator: gpu
precision: bf16-mixed         # halves activation memory; A100 has native bf16 support
